name: Build WebRTC

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 python3-pip git curl pkg-config \
            libx11-dev libxcomposite-dev libxcursor-dev libxdamage-dev \
            libxext-dev libxfixes-dev libxi-dev libxtst-dev \
            libgtk-3-dev libgbm-dev libasound2-dev yasm

        pip3 install requests

    - name: Install depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$GITHUB_WORKSPACE/depot_tools" >> $GITHUB_PATH

    - name: Fetch WebRTC
      run: |
        mkdir webrtc
        cd webrtc
        fetch --nohooks webrtc
        gclient sync

    - name: Build WebRTC (Release)
      run: |
        cd webrtc/src
        gn gen out/Release --args='is_debug=false rtc_use_h264=true use_rtti=true'
        ninja -C out/Release

    - name: Prepare artifact
      run: |
        mkdir -p webrtc-build/include
        mkdir -p webrtc-build/lib

        # Copy headers
        cp -r webrtc/src/api webrtc-build/include/
        cp -r webrtc/src/rtc_base webrtc-build/include/

        # Copy built libs
        cp webrtc/src/out/Release/*.a webrtc-build/lib/ || true
        cp webrtc/src/out/Release/*.so webrtc-build/lib/ || true

    - name: Upload WebRTC artifact
      uses: actions/upload-artifact@v3
      with:
        name: webrtc-linux-x86_64
        path: webrtc-build
